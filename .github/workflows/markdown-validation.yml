name: Markdown validation

on:
  push:
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          find docs architecture runbooks troubleshooting -name '*.md' -print0 |
            while IFS= read -r -d '' file; do
              test -s "$file"
            done
          echo "Markdown file validation passed."
